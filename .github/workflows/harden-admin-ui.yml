name: Harden Admin UI
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/harden-admin-ui.yml
permissions:
  contents: write
jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/harden-admin-ui.py
      - run: npm install
      - run: npm test
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/js/app-auth.js public/js/app-admin-security.js public/js/app-admin-users.js
          git commit -m "Harden admin UI DOM handling" || exit 0
          git push

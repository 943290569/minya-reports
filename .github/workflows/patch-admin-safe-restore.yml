name: Patch Admin Safe Restore
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-admin-safe-restore.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/patch-admin-safe-restore.py
      - run: npm install
      - run: npm test
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/js/app-v3-pages.js
          git commit -m "Route admin restore through safe system flow" || exit 0
          git push

name: Patch Operation Times
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-operation-times.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/patch-operation-times.py
      - run: npm install
      - run: npm test
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/js/app-core.js public/js/app-form.js public/js/app-print-daily.js
          git commit -m "Remove operation start and end times" || exit 0
          git push

name: Inspect and preserve site data
on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-site-data.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY_B64: ${{ secrets.DEPLOY_SSH_KEY_B64 }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s' "$DEPLOY_SSH_KEY_B64" | base64 --decode > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null
          PORT="${DEPLOY_PORT:-22}"
          rm -f ~/.ssh/known_hosts
          for attempt in 1 2 3 4 5 6; do
            if ssh-keyscan -T 10 -p "$PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null && [ -s ~/.ssh/known_hosts ]; then
              break
            fi
            rm -f ~/.ssh/known_hosts
            echo "SSH host key lookup attempt $attempt failed; retrying..."
            sleep 5
          done
          if [ ! -s ~/.ssh/known_hosts ]; then
            echo "Unable to reach the Google server on SSH port $PORT."
            exit 1
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Preserve databases and inspect counts
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_PM2_NAME: ${{ secrets.DEPLOY_PM2_NAME }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          python3 - <<'INSPECT'
          import os,json,shlex,subprocess
          remote = "import os,json,sqlite3,subprocess,hashlib,hmac,datetime,urllib.parse,urllib.request,urllib.error,shlex\nfrom pathlib import Path\npayload=json.load(__import__('sys').stdin)\nroot=Path(payload['path']).resolve()\napp=next(r for r in json.loads(subprocess.check_output(['pm2','jlist'],text=True)) if r.get('name')==payload['name'])\nenv=app.get('pm2_env',{}); config={**env.get('env',{}),**env}\ncurrent=Path(config.get('MINYA_DATA_DIR') or root).resolve()\nfor fn in ('.env.r2','.env'):\n    p=root/fn\n    if p.is_file():\n        for line in p.read_text().splitlines():\n            k,sep,v=line.partition('=')\n            if sep and k.strip().startswith('R2_'):\n                try: config[k.strip()]=shlex.split(v)[0]\n                except Exception: pass\ndef head(key):\n    now=datetime.datetime.now(datetime.timezone.utc);stamp=now.strftime('%Y%m%dT%H%M%SZ');date=stamp[:8]\n    host=config['R2_ACCOUNT_ID']+'.r2.cloudflarestorage.com'\n    enc=lambda s:urllib.parse.quote(str(s),safe='-_.~')\n    uri='/'+enc(config['R2_BUCKET'])+'/'+urllib.parse.quote(key,safe='/-_.~')\n    scope=date+'/auto/s3/aws4_request'\n    params={'X-Amz-Algorithm':'AWS4-HMAC-SHA256','X-Amz-Credential':config['R2_ACCESS_KEY_ID']+'/'+scope,'X-Amz-Date':stamp,'X-Amz-Expires':'300','X-Amz-SignedHeaders':'host'}\n    query='&'.join(enc(k)+'='+enc(v) for k,v in sorted(params.items()))\n    canonical='\\n'.join(['HEAD',uri,query,'host:'+host+'\\n','host','UNSIGNED-PAYLOAD'])\n    signing='\\n'.join(['AWS4-HMAC-SHA256',stamp,scope,hashlib.sha256(canonical.encode()).hexdigest()])\n    secret=('AWS4'+config['R2_SECRET_ACCESS_KEY']).encode()\n    for value in (date,'auto','s3','aws4_request'): secret=hmac.new(secret,value.encode(),hashlib.sha256).digest()\n    sig=hmac.new(secret,signing.encode(),hashlib.sha256).hexdigest()\n    try:\n        with urllib.request.urlopen(urllib.request.Request('https://'+host+uri+'?'+query+'&X-Amz-Signature='+sig,method='HEAD'),timeout=20) as res: return res.status\n    except urllib.error.HTTPError as e:return e.code\ndb=sqlite3.connect('file:'+str(current/'database.db')+'?mode=ro',uri=True);db.row_factory=sqlite3.Row\ndates={r[0] for r in db.execute('select report_date from daily_reports')}\nmissing={}\nbackups=sorted((Path.home()/'minya-db-backups').glob('*.db'),reverse=True)+list((root/'backups').glob('*.db'))\nfor p in backups:\n    old=sqlite3.connect('file:'+str(p)+'?mode=ro',uri=True);old.row_factory=sqlite3.Row\n    tables={r[0] for r in old.execute(\"select name from sqlite_master where type='table'\")}\n    diff={r[0] for r in old.execute('select report_date from daily_reports')}-dates\n    print('MISSING_REPORTS',p.name,len(diff))\n    for table in ('driver_licenses','external_diesel_entries','equipment_assets','movement_vehicles','operation_tasks','maintenance_logs','incident_logs','contractor_contracts','landfill_cells'):\n        if table not in tables:continue\n        try:\n            currentids={r[0] for r in db.execute('select id from '+table)}\n            oldids={r[0] for r in old.execute('select id from '+table)}\n            if oldids-currentids:print('MISSING_RECORDS',table,len(oldids-currentids))\n        except sqlite3.Error:pass\n    if 'cloud_files' in tables:\n        keys={r[0] for r in db.execute('select object_key from cloud_files')}\n        for row in old.execute(\"select * from cloud_files where status='ready'\"):\n            if row['object_key'] not in keys:missing.setdefault(row['object_key'],dict(row))\n    old.close()\nfor key,row in missing.items():\n    status=head(key)\n    print('MISSING_CLOUD_FILE',row['original_name'],'R2_STATUS',status,'SIZE',row['size_bytes'])\nprint('LOCAL_DOCUMENT_CANDIDATES')\nfor folder,dirs,files in os.walk(Path.home()):\n    here=Path(folder)\n    if len(here.relative_to(Path.home()).parts)>=6:dirs[:]=[]\n    dirs[:]=[d for d in dirs if d not in ('node_modules','.git','.npm','.cache','.local','minya-recovery')]\n    for name in files:\n        if name.lower().endswith(('.pdf','.zip')) and ('2026' in name or 'سولار' in name):\n            print('LOCAL_DOCUMENT',str(here/name),(here/name).stat().st_size)\nprint('REPORT_TOTAL',len(dates))\n"
          command=['ssh','-i',os.path.expanduser('~/.ssh/deploy_key'),'-p',os.environ.get('DEPLOY_PORT') or '22','-o','BatchMode=yes','-o','StrictHostKeyChecking=yes',os.environ['DEPLOY_USER']+'@'+os.environ['DEPLOY_HOST'],'python3 -c '+shlex.quote(remote)]
          subprocess.run(command,input=json.dumps({'path':os.environ['DEPLOY_PATH'],'name':os.environ['DEPLOY_PM2_NAME']}),text=True,check=True)
          INSPECT

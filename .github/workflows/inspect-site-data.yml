name: Inspect and preserve site data
on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-site-data.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY_B64: ${{ secrets.DEPLOY_SSH_KEY_B64 }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s' "$DEPLOY_SSH_KEY_B64" | base64 --decode > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null
          PORT="${DEPLOY_PORT:-22}"
          rm -f ~/.ssh/known_hosts
          for attempt in 1 2 3 4 5 6; do
            if ssh-keyscan -T 10 -p "$PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null && [ -s ~/.ssh/known_hosts ]; then
              break
            fi
            rm -f ~/.ssh/known_hosts
            echo "SSH host key lookup attempt $attempt failed; retrying..."
            sleep 5
          done
          if [ ! -s ~/.ssh/known_hosts ]; then
            echo "Unable to reach the Google server on SSH port $PORT."
            exit 1
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Preserve databases and inspect counts
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_PM2_NAME: ${{ secrets.DEPLOY_PM2_NAME }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          python3 - <<'INSPECT'
          import os,json,shlex,subprocess
          remote = "import os,json,sqlite3,subprocess,hashlib\nfrom pathlib import Path\npayload=json.load(__import__('sys').stdin)\nroot=Path(payload['path']).resolve()\napp=next(r for r in json.loads(subprocess.check_output(['pm2','jlist'],text=True)) if r.get('name')==payload['name'])\nenv=app.get('pm2_env',{})\ncurrent=Path(env.get('MINYA_DATA_DIR') or env.get('env',{}).get('MINYA_DATA_DIR') or root).resolve()\ndb=sqlite3.connect('file:'+str(current/'database.db')+'?mode=ro',uri=True)\ndb.row_factory=sqlite3.Row\nprint('AUDIT_COLUMNS',json.dumps([r[1] for r in db.execute('pragma table_info(audit_logs)')]))\nfor r in db.execute(\"select * from audit_logs where action like '%DELETE%' or action like '%RESTORE%' order by id desc limit 30\"):\n    row=dict(r);row.pop('username',None);row.pop('user_name',None);print('CHANGE_AUDIT',json.dumps(row,ensure_ascii=False))\nfor r in db.execute('select id,folder_id,original_name,size_bytes,status,created_at from cloud_files order by id'): print('FILE_METADATA',json.dumps(dict(r),ensure_ascii=False))\nfor r in db.execute('select substr(report_date,1,4) year,count(*) count from daily_reports group by year'): print('REPORT_YEAR',json.dumps(dict(r)))\nfor r in db.execute(\"select action,count(*) count from audit_logs where created_at>='2026-09-01' group by action\"): print('RECENT_ACTION_COUNTS',json.dumps(dict(r)))\n"
          command=['ssh','-i',os.path.expanduser('~/.ssh/deploy_key'),'-p',os.environ.get('DEPLOY_PORT') or '22','-o','BatchMode=yes','-o','StrictHostKeyChecking=yes',os.environ['DEPLOY_USER']+'@'+os.environ['DEPLOY_HOST'],'python3 -c '+shlex.quote(remote)]
          subprocess.run(command,input=json.dumps({'path':os.environ['DEPLOY_PATH'],'name':os.environ['DEPLOY_PM2_NAME']}),text=True,check=True)
          INSPECT

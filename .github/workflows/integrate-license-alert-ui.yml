name: Integrate license alert UI
on:
  push:
    branches: [main]
    paths:
      - 'scripts/install-license-alert-ui.js'
      - 'public/js/app-driver-license-badge.js'
      - '.github/workflows/integrate-license-alert-ui.yml'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply UI patch
        run: node scripts/install-license-alert-ui.js
      - name: Rebuild bundle
        run: node scripts/build-app-bundle.js
      - name: Commit integrated changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app.js public/app-bundle.js public/drivers-licenses.html public/js/app-driver-licenses.js
          git commit -m "عرض تنبيهات الرخص باللون الأحمر وشارة 45 يوم"
          git push origin main

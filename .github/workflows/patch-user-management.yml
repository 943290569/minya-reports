name: Patch User Management
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-user-management.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/patch-user-management.py
      - run: node --check server.js
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server.js
          git commit -m "Protect administrator account management" || exit 0
          git push

name: Inspect maintenance DB v2
on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-maintenance-db-v2.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY_B64: ${{ secrets.DEPLOY_SSH_KEY_B64 }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s' "$DEPLOY_SSH_KEY_B64" | base64 --decode > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          PORT="${DEPLOY_PORT:-22}"
          ssh-keyscan -T 10 -p "$PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Inspect database
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_PM2_NAME: ${{ secrets.DEPLOY_PM2_NAME }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -euo pipefail
          PORT="${DEPLOY_PORT:-22}"
          SCRIPT=$(cat <<'PY' | base64 -w0
import json, os, sqlite3, subprocess
from pathlib import Path
root=Path(os.environ['DEPLOY_PATH']).resolve()
rows=json.loads(subprocess.check_output(['pm2','jlist'],text=True))
app=next(r for r in rows if r.get('name')==os.environ['DEPLOY_PM2_NAME'])
env=app.get('pm2_env',{})
merged={**env.get('env',{}),**env}
data=Path(merged.get('MINYA_DATA_DIR') or root).resolve()
db=sqlite3.connect(data/'database.db')
db.row_factory=sqlite3.Row
print('DB_PATH', data/'database.db')
print('READY_FILES', db.execute("select count(*) from cloud_files where status='ready'").fetchone()[0])
print('PENDING_FILES', db.execute("select count(*) from cloud_files where status='pending'").fetchone()[0])
print('FOLDER_COUNT', db.execute("select count(*) from cloud_folders").fetchone()[0])
print('LINK_COUNT', db.execute("select count(*) from cloud_file_links").fetchone()[0])
rootrow=db.execute("select id,name from cloud_folders where parent_id is null and name='الصيانة'").fetchone()
print('MAINT_ROOT', dict(rootrow) if rootrow else None)
if rootrow:
    mid=rootrow['id']
    children=db.execute("select id,name,parent_id from cloud_folders where parent_id=? order by name",(mid,)).fetchall()
    print('CHILDREN', [dict(r) for r in children])
    machine=db.execute("select id,name from cloud_folders where parent_id=? and lower(name)=lower('all machins and cars')",(mid,)).fetchone()
    print('MACHINE_ROOT', dict(machine) if machine else None)
    if machine:
        assets=db.execute("select id,name from cloud_folders where parent_id=? order by name",(machine['id'],)).fetchall()
        print('ASSET_COUNT', len(assets))
        for r in assets:
            ids=[r['id']]
            q=[r['id']]
            while q:
                cur=q.pop(0)
                for ch in db.execute("select id from cloud_folders where parent_id=?",(cur,)).fetchall():
                    ids.append(ch['id']); q.append(ch['id'])
            marks=','.join('?' for _ in ids)
            cnt=db.execute(f"select count(*) from cloud_files where status='ready' and folder_id in ({marks})",ids).fetchone()[0]
            print('ASSET', r['id'], r['name'], 'FILES', cnt, 'FOLDERS', len(ids))
print('TOP_FILE_FOLDERS')
for r in db.execute("""select coalesce(folder_id,-1) folder_id,count(*) c
                     from cloud_files where status='ready'
                     group by folder_id order by c desc limit 30""").fetchall():
    folder=db.execute("select name,parent_id from cloud_folders where id=?",(r['folder_id'],)).fetchone() if r['folder_id']!=-1 else None
    print('FOLDER_FILES', r['folder_id'], r['c'], dict(folder) if folder else None)
print('SAMPLES')
for r in db.execute("select id,folder_id,original_name,status from cloud_files order by id desc limit 20").fetchall():
    print(dict(r))
PY
          )
          ssh -i ~/.ssh/deploy_key -p "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "DEPLOY_PATH='$DEPLOY_PATH' DEPLOY_PM2_NAME='$DEPLOY_PM2_NAME' SCRIPT='$SCRIPT' python3 -c \"import os,base64;exec(base64.b64decode(os.environ['SCRIPT']))\""

name: Import daily soil trips August September 2026
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-soil-trips-2026.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-google-production
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies for isolated import test
        run: npm ci
      - name: Verify canonical cover import
        run: node scripts/soil-cover-import-test.js
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY_B64: ${{ secrets.DEPLOY_SSH_KEY_B64 }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s' "$DEPLOY_SSH_KEY_B64" | base64 --decode > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          PORT="${DEPLOY_PORT:-22}"
          for attempt in 1 2 3 4 5 6; do
            if ssh-keyscan -T 10 -p "$PORT" -H "$DEPLOY_HOST" > ~/.ssh/known_hosts 2>/dev/null && [ -s ~/.ssh/known_hosts ]; then break; fi
            sleep 5
          done
          test -s ~/.ssh/known_hosts
      - name: Backup and import combined daily soil trips
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_PM2_NAME: ${{ secrets.DEPLOY_PM2_NAME }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          python3 - <<'PY'
          import json,os,shlex,subprocess
          from pathlib import Path
          bootstrap=Path('scripts/remote-soil-import.py').read_text()
          command=['ssh','-i',os.path.expanduser('~/.ssh/deploy_key'),'-p',os.environ.get('DEPLOY_PORT') or '22','-o','BatchMode=yes','-o','StrictHostKeyChecking=yes',os.environ['DEPLOY_USER']+'@'+os.environ['DEPLOY_HOST'],'python3 -c '+shlex.quote(bootstrap)]
          payload={'name':os.environ['DEPLOY_PM2_NAME'],'path':os.environ['DEPLOY_PATH'],'script':Path('scripts/import-soil-trips-2026.js').read_text(),'csv':Path('data/pending-review/soil-trips-2026-08-09.csv').read_text()}
          subprocess.run(command,input=json.dumps(payload,ensure_ascii=False),text=True,check=True)
          PY
      - name: Verify production site
        run: curl --fail --silent --show-error --location --retry 3 --max-time 20 https://alminya-landfill.duckdns.org/ > /dev/null

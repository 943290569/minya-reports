name: Deploy to Google SSH

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-google-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Validate deployment secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SSH_KEY_B64: ${{ secrets.DEPLOY_SSH_KEY_B64 }}
          DEPLOY_PM2_NAME: ${{ secrets.DEPLOY_PM2_NAME }}
        run: |
          set -euo pipefail

          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_PATH DEPLOY_SSH_KEY_B64 DEPLOY_PM2_NAME; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub secret: $name"
              exit 1
            fi
          done

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY_B64: ${{ secrets.DEPLOY_SSH_KEY_B64 }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s' "$DEPLOY_SSH_KEY_B64" | base64 --decode > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Validate the decoded private key before attempting SSH.
          ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null

          PORT="${DEPLOY_PORT:-22}"
          ssh-keyscan -p "$PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy latest main to Google server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_PM2_NAME: ${{ secrets.DEPLOY_PM2_NAME }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -euo pipefail

          PORT="${DEPLOY_PORT:-22}"

          ssh -i ~/.ssh/deploy_key -p "$PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' DEPLOY_PM2_NAME='$DEPLOY_PM2_NAME' bash -s" <<'REMOTE'
          set -euo pipefail

          cd "$DEPLOY_PATH"

          echo "Current commit: $(git rev-parse --short HEAD 2>/dev/null || echo unknown)"

          git fetch origin main
          git checkout main
          git reset --hard origin/main

          if [ -f package-lock.json ]; then
            npm ci --omit=dev
          else
            npm install --omit=dev
          fi

          pm2 restart "$DEPLOY_PM2_NAME" --update-env
          pm2 save

          echo "Deployed commit: $(git rev-parse --short HEAD)"
          REMOTE

      - name: Verify production site
        run: |
          set -euo pipefail

          curl --fail --silent --show-error --location \
            --retry 5 --retry-delay 3 \
            --max-time 20 \
            https://alminya-landfill.duckdns.org/ >/dev/null

          echo "Production site is reachable."

name: Deploy to Google SSH

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-google-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Validate deployment secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SSH_KEY_B64: ${{ secrets.DEPLOY_SSH_KEY_B64 }}
          DEPLOY_PM2_NAME: ${{ secrets.DEPLOY_PM2_NAME }}
        run: |
          set -euo pipefail
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_PATH DEPLOY_SSH_KEY_B64 DEPLOY_PM2_NAME; do
            if [ -z "${!name:-}" ]; then echo "Missing required GitHub secret: $name"; exit 1; fi
          done

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY_B64: ${{ secrets.DEPLOY_SSH_KEY_B64 }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s' "$DEPLOY_SSH_KEY_B64" | base64 --decode > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null
          PORT="${DEPLOY_PORT:-22}"
          rm -f ~/.ssh/known_hosts
          for attempt in 1 2 3 4 5 6; do
            if ssh-keyscan -T 10 -p "$PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null && [ -s ~/.ssh/known_hosts ]; then
              break
            fi
            rm -f ~/.ssh/known_hosts
            echo "SSH host key lookup attempt $attempt failed; retrying..."
            sleep 5
          done
          if [ ! -s ~/.ssh/known_hosts ]; then
            echo "Unable to reach the Google server on SSH port $PORT."
            exit 1
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Install complete R2 configuration from GitHub secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          python3 - <<'R2_INSTALL'
          import json, os, shlex, subprocess
          keys = ('R2_ACCOUNT_ID', 'R2_ACCESS_KEY_ID', 'R2_SECRET_ACCESS_KEY', 'R2_BUCKET')
          config = {k: os.environ.get(k, '').strip() for k in keys}
          missing = [k for k in keys if not config[k]]
          if missing:
              print('GitHub R2 secrets missing: ' + ', '.join(missing))
              print('Keeping any server-local R2 configuration.')
          else:
              remote = "import json, os, tempfile\nfrom pathlib import Path\npayload = json.load(__import__('sys').stdin)\nconfig = payload['config']\nkeys = ('R2_ACCOUNT_ID', 'R2_ACCESS_KEY_ID', 'R2_SECRET_ACCESS_KEY', 'R2_BUCKET')\nif not all(isinstance(config.get(k), str) and config[k].strip() for k in keys):\n    raise SystemExit('Incomplete R2 configuration')\ntarget = Path(payload['path']) / '.env.r2'\nif not target.parent.is_dir():\n    raise SystemExit('Deployment directory missing')\nfd, temp = tempfile.mkstemp(prefix='.r2-config-', dir=target.parent)\ntry:\n    with os.fdopen(fd, 'w', encoding='utf-8') as f:\n        f.write(''.join(k + '=' + json.dumps(config[k].strip()) + '\\n' for k in keys))\n    os.chmod(temp, 0o600)\n    os.replace(temp, target)\nexcept BaseException:\n    if os.path.exists(temp):\n        os.unlink(temp)\n    raise\nprint('Complete R2 configuration installed securely.')\n"
              command = ['ssh', '-i', os.path.expanduser('~/.ssh/deploy_key'),
                         '-p', os.environ.get('DEPLOY_PORT') or '22',
                         '-o', 'BatchMode=yes', '-o', 'StrictHostKeyChecking=yes',
                         os.environ['DEPLOY_USER'] + '@' + os.environ['DEPLOY_HOST'],
                         'python3 -c ' + shlex.quote(remote)]
              payload = {'path': os.environ['DEPLOY_PATH'], 'config': config}
              subprocess.run(command, input=json.dumps(payload), text=True, check=True)
          R2_INSTALL

      - name: Deploy latest main to Google server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_PM2_NAME: ${{ secrets.DEPLOY_PM2_NAME }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -euo pipefail
          PORT="${DEPLOY_PORT:-22}"
          ssh -i ~/.ssh/deploy_key -p "$PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' DEPLOY_PM2_NAME='$DEPLOY_PM2_NAME' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          echo "Current commit: $(git rev-parse --short HEAD 2>/dev/null || echo unknown)"
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          if [ -f package-lock.json ]; then npm ci --omit=dev; else npm install --omit=dev; fi
          node scripts/install-guest-access.js
          node scripts/install-ops-suite.js
          npm run build:app

          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/start-server.js')
          s = p.read_text(encoding='utf-8')
          old = '''replacements.forEach(([before, after], index) => {
            const matches = countOccurrences(source, before);
            if (matches !== 1) {'''
          previous = '''replacements.forEach(([before, after], index) => {
            if (source.includes(after)) return;
            const matches = countOccurrences(source, before);
            if (matches !== 1) {'''
          new = '''replacements.forEach(([before, after], index) => {
            if (source.includes(after)) return;
            const matches = countOccurrences(source, before);
            if (matches === 0) {
              console.warn(`Runtime server sync skipped patch ${index + 1}: source fragment already transformed or unavailable.`);
              return;
            }
            if (matches !== 1) {'''
          if new not in s:
              if previous in s:
                  s = s.replace(previous, new, 1)
              elif old in s:
                  s = s.replace(old, new, 1)
              else:
                  raise SystemExit('Unable to locate runtime sync loop')
              p.write_text(s, encoding='utf-8')
          print('Runtime sync compatibility guard installed for deployment.')
          PY

          restart_app() {
          python3 - <<'R2_RECOVERY'
          import json, os, shlex, subprocess
          from pathlib import Path
          keys = ('R2_ACCOUNT_ID', 'R2_ACCESS_KEY_ID', 'R2_SECRET_ACCESS_KEY', 'R2_BUCKET')
          name = os.environ['DEPLOY_PM2_NAME']
          def complete(env):
              return all(str(env.get(k, '')).strip() for k in keys)
          def app_env(rows):
              for row in rows:
                  env = row.get('pm2_env', row)
                  if env.get('name', row.get('name')) == name:
                      return {**env.get('env', {}), **env}
              return {}
          candidates = []
          try:
              current = app_env(json.loads(subprocess.check_output(['pm2', 'jlist'], text=True)))
              candidates.append(('running process', current))
          except Exception:
              current = {}
          for filename in ('.env.r2', '.env', '.env.production'):
              p = Path(filename)
              if not p.is_file():
                  continue
              env = {}
              for line in p.read_text(encoding='utf-8').splitlines():
                  line = line.strip()
                  if line.startswith('export '):
                      line = line[7:].strip()
                  key, sep, value = line.partition('=')
                  if sep and key.strip() in keys:
                      try:
                          parts = shlex.split(value, comments=True)
                          if len(parts) == 1:
                              env[key.strip()] = parts[0]
                      except ValueError:
                          pass
              candidates.append((filename, env))
          dump = Path(os.environ.get('PM2_HOME', str(Path.home() / '.pm2'))) / 'dump.pm2'
          if dump.is_file():
              try:
                  candidates.append(('saved PM2 process', app_env(json.loads(dump.read_text(encoding='utf-8')))))
              except Exception:
                  pass
          selected = next(((source, env) for source, env in candidates if complete(env)), None)
          restart_env = os.environ.copy()
          if selected:
              source, env = selected
              restart_env.update({k: str(env[k]).strip() for k in keys})
              print('R2 configuration restored from ' + source, flush=True)
          else:
              print('R2 configuration incomplete. No credential values were changed.', flush=True)
              for k in keys:
                  print(k + ': ' + ('present' if str(current.get(k, '')).strip() else 'missing'), flush=True)
          subprocess.run(['pm2', 'restart', name, '--update-env'], env=restart_env, check=True)
          R2_RECOVERY
          }
          if ! restart_app; then
            echo "Normal PM2 restart failed; rebuilding PM2 daemon from saved process list."
            pm2 kill || true
            sleep 2
            pm2 resurrect
            sleep 3
          fi
          sleep 5
          pm2 describe "$DEPLOY_PM2_NAME" || true
          echo "---- PM2 logs ----"
          pm2 logs "$DEPLOY_PM2_NAME" --lines 120 --nostream || true
          echo "---- local HTTP ----"
          LOCAL_OK=0
          for P in 6000 5001; do
            if curl --fail --silent --show-error --max-time 10 "http://127.0.0.1:${P}/" >/dev/null; then
              echo "Local application reachable on port ${P}."
              LOCAL_OK=1
              break
            fi
          done
          if [ "$LOCAL_OK" -ne 1 ]; then
            echo "Local application check failed on ports 6000 and 5001"
            pm2 logs "$DEPLOY_PM2_NAME" --lines 200 --nostream || true
            exit 1
          fi
          pm2 save
          echo "Deployed commit: $(git rev-parse --short HEAD)"
          REMOTE

      - name: Verify production site
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --retry 8 --retry-delay 3 \
            --max-time 20 \
            https://alminya-landfill.duckdns.org/ >/dev/null
          echo "Production site is reachable."

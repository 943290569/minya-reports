name: Unify driver license save
on:
  push:
    branches: [feat/unify-license-save]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[unify-license-save-auto]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: feat/unify-license-save}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node scripts/patch-unify-license-save.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/drivers-licenses.html public/js/app-driver-licenses.js
          git diff --cached --quiet || git commit -m "[unify-license-save-auto] توحيد حفظ وتجديد الرخصة"
          git push

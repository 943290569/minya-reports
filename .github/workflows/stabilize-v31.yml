name: Stabilize V3.1
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/stabilize-v31.yml
permissions:
  contents: write
jobs:
  stabilize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/stabilize-v31.py
      - run: npm install
      - run: npm test
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server.js public/js/app-v3-pages.js
          git commit -m "Stabilize V3.1 security and admin flows" || exit 0
          git push

<!DOCTYPE html>
<html lang="ar" dir="rtl">

<style>

.monthly-report {
  margin-top: 24px;
  padding-top: 20px;
  border-top: 2px solid #d1d5db;
}

.monthly-report h3 {
  margin: 0 0 18px;
  text-align: center;
  font-size: 20px;
  font-weight: 700;
  color: #111827;
}

.monthly-summary {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
  margin-bottom: 18px;
}

.monthly-summary > div {
  background: #ffffff;
  border: 1px solid #d1d5db;
  border-radius: 8px;
  padding: 14px 10px;
  text-align: center;
  min-height: 94px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.monthly-summary span {
  display: block;
  margin-bottom: 7px;
  font-size: 13px;
  color: #4b5563;
}

.monthly-summary strong {
  display: block;
  font-size: 21px;
  line-height: 1.2;
  color: #111827;
}

.monthly-summary small {
  display: block;
  margin-top: 4px;
  font-size: 11px;
  color: #6b7280;
}

.monthly-comparison {
  margin: 18px 0;
  padding: 14px;
  border: 1px solid #d1d5db;
  border-radius: 8px;
  background: #f9fafb;
}

.monthly-comparison h4 {
  margin: 0 0 12px;
  text-align: center;
  font-size: 16px;
}

.monthly-comparison-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
}

.monthly-comparison-grid > div {
  background: #ffffff;
  border: 1px solid #d1d5db;
  border-radius: 8px;
  padding: 12px 8px;
  text-align: center;
}

.monthly-comparison-grid span,
.monthly-comparison-grid small {
  display: block;
  color: #6b7280;
}

.monthly-comparison-grid strong {
  display: block;
  margin: 6px 0;
  font-size: 18px;
}

.monthly-comparison-empty {
  text-align: center;
  font-size: 14px;
  color: #6b7280;
}

.monthly-chart {
  margin: 18px 0;
  padding: 14px;
  border: 1px solid #d1d5db;
  border-radius: 8px;
  background: #ffffff;
}

.monthly-chart h4 {
  margin: 0 0 14px;
  text-align: center;
  font-size: 16px;
}

.monthly-chart-scroll {
  width: 100%;
  overflow-x: auto;
  padding-bottom: 6px;
}

.monthly-chart-bars {
  min-width: 720px;
  height: 240px;
  display: flex;
  align-items: flex-end;
  gap: 7px;
  padding: 28px 8px 0;
  border-bottom: 1px solid #9ca3af;
}

.monthly-chart-item {
  flex: 1 0 24px;
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  align-items: center;
  min-width: 24px;
}

.monthly-chart-value {
  font-size: 10px;
  color: #374151;
  margin-bottom: 4px;
  white-space: nowrap;
}

.monthly-chart-bar {
  width: 70%;
  min-height: 2px;
  background: #2563eb;
  border-radius: 4px 4px 0 0;
}

.monthly-chart-day {
  font-size: 10px;
  margin-top: 5px;
  color: #4b5563;
}

.monthly-chart-empty {
  padding: 24px 10px;
  text-align: center;
  color: #6b7280;
  font-size: 14px;
}

.monthly-actions {
  display: flex;
  justify-content: center;
  margin: 18px 0;
}

#printMonthlyReportBtn {
  min-width: 220px;
  padding: 11px 20px;
  border: 0;
  border-radius: 7px;
  cursor: pointer;
  font-size: 15px;
  font-weight: 700;
}

.archive-summary {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
  margin: 18px 0;
}

.archive-summary > div {
  border: 1px solid #d1d5db;
  border-radius: 8px;
  padding: 12px 8px;
  text-align: center;
}

.archive-summary span {
  display: block;
  margin-bottom: 6px;
  font-size: 13px;
}

.archive-summary strong {
  display: block;
  font-size: 20px;
}

.archive-summary small {
  display: block;
  margin-top: 3px;
  font-size: 11px;
}

.archive-filters {
  display: grid;
  grid-template-columns: 1fr 1fr auto;
  gap: 12px;
  align-items: end;
  margin-bottom: 16px;
}

.archive-filters label {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.archive-filters input {
  width: 100%;
}

#clearArchiveFiltersBtn {
  height: 42px;
  padding: 0 18px;
}

@media (max-width: 1000px) {
  .monthly-summary {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .archive-summary {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

@media (max-width: 700px) {
  .monthly-summary {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .monthly-comparison-grid {
    grid-template-columns: 1fr;
  }

  .archive-filters {
    grid-template-columns: 1fr;
  }

  .archive-summary {
    grid-template-columns: 1fr 1fr;
  }
}

@media (max-width: 480px) {
  .monthly-summary,
  .archive-summary {
    grid-template-columns: 1fr;
  }
}

</style>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <section class="panel"><h2>العمليات</h2><table id="operationsTable"><thead><tr><th>العملية</th><th>عدد المركبات</th><th>الكمية</th><th>الوحدة</th></tr></thead><tbody></tbody></table></section>
    <section class="panel"><h2>محطات الترحيل</h2><table id="stationsTable"><thead><tr><th>المحطة</th><th>عدد الشاحنات</th><th>الكمية</th><th>الوحدة</th></tr></thead><tbody></tbody></table></section>
    <section class="panel"><h2>تقرير الصيانة اليومي</h2><table id="equipmentTable"><thead><tr><th>اسم الآلية</th><th>حالة الآلية</th><th>وصف الحالة</th><th>ساعات العمل</th><th>كمية السولار</th></tr></thead><tbody></tbody></table></section>
    <section class="panel"><h2>الملاحظات</h2><textarea id="notes" rows="5" placeholder="اكتب الملاحظات اليومية هنا..."></textarea></section>

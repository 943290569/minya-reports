<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>متابعة الشكوى</title><link rel="stylesheet" href="/employee-complaints.css?v=1"></head>
<body><main class="complaint-shell"><section class="complaint-card"><div class="brand">المجلس المشترك لإدارة النفايات الصلبة</div><h1>متابعة الشكوى</h1><p class="lead">أدخل كود المتابعة الذي حصلت عليه عند تقديم الشكوى لعرض الحالة والرد.</p><form id="trackingForm"><label for="trackingCode">كود المتابعة</label><input id="trackingCode" type="text" dir="ltr" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="64" required style="font-size:16px"><button id="trackingSubmit" type="submit">عرض الحالة والرد</button><p id="trackingMessage" class="message" role="status" aria-live="polite"></p></form></section>
<section id="trackingResult" class="complaint-card" hidden aria-live="polite"><h2>وضع الشكوى</h2><div class="tracking-grid"><div><small>رقم الشكوى</small><strong id="trackNo"></strong></div><div><small>الحالة</small><strong id="trackStatus"></strong></div><div><small>تاريخ الاستحقاق</small><strong id="trackDue"></strong></div></div><div id="trackResponseWrap"><h2>الرد</h2><p id="trackResponse"></p></div></section><section class="complaint-card compact"><a href="/employee-complaints.html">تقديم شكوى</a></section></main><script src="/employee-complaints-track.js?v=1" defer></script></body></html>

<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <title>تعبئة السولار</title>
  <link rel="stylesheet" href="/style.css?v=external-diesel-entry-v1">
  <style>
    body{margin:0;background:#f4f7f5;color:#17382d;font-family:Tahoma,Arial,sans-serif}
    .fuel-entry-shell{width:min(1180px,calc(100% - 24px));margin:24px auto 48px}
    .fuel-entry-card{background:#fff;border:1px solid #d8e5df;border-radius:16px;padding:20px;box-shadow:0 8px 28px rgba(20,70,52,.07)}
    .fuel-entry-brand{text-align:center;margin-bottom:18px}
    .fuel-entry-brand img{width:92px;height:92px;object-fit:contain;border-radius:18px}
    .fuel-entry-brand h1{margin:10px 0 4px;font-size:22px}
    .fuel-entry-brand p{margin:0;color:#60736c}
    .fuel-entry-status{margin:0 0 16px;padding:10px 12px;border-radius:10px;background:#eef6f2;color:#315d4c;font-weight:700}
    .fuel-entry-status.error{background:#fff1f1;color:#a51d1d}
    .fuel-entry-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .fuel-entry-grid label{display:flex;flex-direction:column;gap:7px;font-weight:800;color:#29453b}
    .fuel-entry-grid .wide{grid-column:1/-1}
    .fuel-entry-grid input{width:100%;min-width:0;box-sizing:border-box;padding:12px;border:1px solid #cbd9d2;border-radius:10px;background:#fff;color:#17382d;font:inherit;font-size:16px}
    .fuel-entry-grid input:focus{outline:3px solid rgba(23,107,79,.14);border-color:#176b4f}
    .fuel-entry-actions{display:flex;gap:10px;margin-top:16px}
    .fuel-entry-actions button{flex:1;min-height:46px;border-radius:10px;font:inherit;font-weight:800;cursor:pointer}
    #fuelSaveBtn{background:#176b4f;color:#fff;border:1px solid #176b4f}
    #fuelResetBtn{background:#fff;color:#315d4c;border:1px solid #b9ccc3}
    #fuelMessage{min-height:22px;margin:12px 0 0;font-weight:800}
    #fuelMessage.success{color:#087443}
    #fuelMessage.error{color:#b42318}
    .fuel-entry-note{margin-top:18px;padding-top:14px;border-top:1px solid #e3ebe7;color:#697a74;font-size:13px;text-align:center}
    .fuel-history{margin-top:18px}
    .fuel-history h2{margin:0 0 10px;font-size:18px}
    .fuel-history-filters{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end;margin-bottom:12px}
    .fuel-history-filters label{display:flex;flex-direction:column;gap:6px;font-weight:800}
    .fuel-history-filters input{min-width:0;padding:10px;border:1px solid #cbd9d2;border-radius:9px;font:inherit;font-size:16px}
    .fuel-history-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
    .fuel-history-summary div{padding:10px;border:1px solid #dbe7e1;border-radius:10px;background:#f8fbf9;text-align:center}
    .fuel-history-summary span{display:block;font-size:12px;color:#65766f}
    .fuel-history-summary strong{display:block;margin-top:4px;font-size:18px}
    .fuel-table-wrap{overflow:auto;border:1px solid #dde7e2;border-radius:10px}
    .fuel-table{width:100%;border-collapse:separate;border-spacing:0;min-width:980px}
    .fuel-table th,.fuel-table td{padding:9px;border-bottom:1px solid #e5ece8;text-align:center;font-size:13px}
    .fuel-table th{background:#eef5f1}
    .fuel-history-empty{text-align:center;padding:14px;color:#6d7d77}
    .fuel-day-total td{background:#eef6f2;color:#17593f;font-weight:900}
    .fuel-history-actions{display:flex;gap:8px;align-items:end}
    .fuel-history-actions button{min-height:43px;padding:9px 14px;border-radius:9px;font:inherit;font-weight:800}
    #fuelPrintBtn{background:#173f31;color:#fff;border:1px solid #173f31}
    .fuel-row-actions{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:nowrap;min-width:150px}
    .fuel-row-actions button{flex:0 0 auto;min-width:68px;padding:7px 10px;min-height:36px;border-radius:8px;font:inherit;font-weight:800;white-space:nowrap}
    .fuel-edit-btn{background:#eef6f2;color:#17593f;border:1px solid #bed7cb}
    .fuel-delete-btn{background:#fff1f1;color:#a51d1d;border:1px solid #efc8c8}
    .fuel-table th:first-child,.fuel-table td:first-child{min-width:160px;width:160px;white-space:nowrap;position:sticky;right:0;z-index:3;background:#fff;box-shadow:6px 0 10px rgba(20,70,52,.08)}
    .fuel-table th:first-child{z-index:5;background:#eef5f1}
    .fuel-day-total td:first-child{background:#eef6f2}
    @media(max-width:600px){.fuel-entry-shell{width:calc(100% - 14px);margin-top:8px}.fuel-entry-card{padding:14px}.fuel-entry-grid{grid-template-columns:1fr}.fuel-entry-grid .wide{grid-column:auto}.fuel-entry-actions{flex-direction:column}.fuel-entry-brand h1{font-size:20px}.fuel-history-filters{grid-template-columns:1fr}.fuel-history-summary{grid-template-columns:1fr 1fr}.fuel-table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}.fuel-table{min-width:900px}.fuel-table th:first-child,.fuel-table td:first-child{min-width:140px;width:140px}.fuel-row-actions{min-width:132px}.fuel-row-actions button{min-width:62px;padding:8px 7px}}
  </style>
</head>
<body>
  <main class="fuel-entry-shell">
    <section class="fuel-entry-card">
      <div class="fuel-entry-brand">
        <img src="/assets/brand-recycle-truck-jsc-512.png" alt="JSC_H&B">
        <h1>تعبئة السولار</h1>
        <p>إدخال تعبئة السولار للشركات</p>
      </div>
      <p id="fuelLinkStatus" class="fuel-entry-status">جاري التحقق من صلاحية الرابط...</p>
      <form id="fuelForm" hidden>
        <div class="fuel-entry-grid">
          <label class="wide">الشركة
            <input id="fuelCompany" list="fuelCompanyList" maxlength="120" autocomplete="organization" required placeholder="اكتب أول حرف من اسم الشركة">
          </label>
          <label>التاريخ
            <input id="fuelDate" type="date" required>
          </label>
          <label>اسم السائق
            <input id="fuelDriver" list="fuelDriverList" maxlength="120" autocomplete="off" required placeholder="اكتب أول حرف من الاسم">
          </label>
          <label>رقم المركبة
            <input id="fuelVehicle" list="fuelVehicleList" maxlength="40" autocomplete="off" required placeholder="اكتب أول رقم">
          </label>
          <label>الكمية باللتر
            <input id="fuelQuantity" type="number" min="0.01" max="50000" step="0.01" inputmode="decimal" required>
          </label>
          <label>رقم الوصل
            <input id="fuelReceipt" maxlength="50" inputmode="numeric">
          </label>
          <label class="wide">ملاحظات
            <input id="fuelNotes" maxlength="500">
          </label>
        </div>
        <datalist id="fuelDriverList"></datalist>
        <datalist id="fuelVehicleList"></datalist>
        <div class="fuel-entry-actions">
          <button id="fuelSaveBtn" type="submit">حفظ التعبئة</button>
          <button id="fuelResetBtn" type="button">تفريغ الحقول</button>
        </div>
        <p id="fuelMessage" aria-live="polite"></p>
      </form>
      <section class="fuel-history" id="fuelHistory" hidden>
        <h2>سجلات السولار الخارجي</h2>
        <div class="fuel-history-filters">
          <label>الشركة
            <input id="fuelHistoryCompany" list="fuelCompanyList" placeholder="كل الشركات">
          </label>
          <label>الشهر والسنة
            <input id="fuelHistoryMonth" type="month">
          </label>
          <div class="fuel-history-actions">
            <button id="fuelHistoryLoadBtn" type="button">عرض</button>
            <button id="fuelPrintBtn" type="button">طباعة التقرير</button>
          </div>
        </div>
        <datalist id="fuelCompanyList"></datalist>
        <div class="fuel-history-summary">
          <div><span>إجمالي السولار</span><strong id="fuelHistoryTotal">0</strong></div>
          <div><span>أيام التعبئة</span><strong id="fuelHistoryDays">0</strong></div>
          <div><span>المتوسط اليومي</span><strong id="fuelHistoryAverage">0</strong></div>
        </div>
        <div class="fuel-table-wrap">
          <table class="fuel-table">
            <thead><tr><th>إجراء</th><th>التاريخ</th><th>الشركة</th><th>السائق</th><th>المركبة</th><th>الكمية</th><th>الوصل</th><th>ملاحظات</th></tr></thead>
            <tbody id="fuelHistoryBody"><tr><td colspan="8" class="fuel-history-empty">جاري التحميل...</td></tr></tbody>
          </table>
        </div>
      </section>
      <div class="fuel-entry-note">هذا الرابط مخصص للسولار الخارجي فقط ولا يمنح صلاحية الدخول إلى بقية نظام المكب.</div>
    </section>
  </main>
  <script>
    (() => {
      const params = new URLSearchParams(location.search);
      const token = String(params.get("token") || "").trim();
      const statusNode = document.getElementById("fuelLinkStatus");
      const form = document.getElementById("fuelForm");
      const message = document.getElementById("fuelMessage");
      const saveBtn = document.getElementById("fuelSaveBtn");
      const history = document.getElementById("fuelHistory");
      const historyBody = document.getElementById("fuelHistoryBody");
      const historyCompany = document.getElementById("fuelHistoryCompany");
      const historyMonth = document.getElementById("fuelHistoryMonth");
      let currentEntries = [];
      let currentSummary = {};
      let currentSuggestions = [];
      let editingId = null;
      const fields = {
        company: document.getElementById("fuelCompany"),
        date: document.getElementById("fuelDate"),
        driver: document.getElementById("fuelDriver"),
        vehicle: document.getElementById("fuelVehicle"),
        quantity: document.getElementById("fuelQuantity"),
        receipt: document.getElementById("fuelReceipt"),
        notes: document.getElementById("fuelNotes")
      };

      function today() {
        const parts = new Intl.DateTimeFormat("en-CA", { timeZone:"Asia/Jerusalem", year:"numeric", month:"2-digit", day:"2-digit" }).formatToParts(new Date());
        const map = Object.fromEntries(parts.map(part => [part.type, part.value]));
        return map.year + "-" + map.month + "-" + map.day;
      }
      function setMessage(text, type="") {
        message.textContent = text || "";
        message.className = type;
      }
      function esc(value) {
        return String(value ?? "").replace(/[&<>"']/g, ch => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[ch]));
      }
      function fmt(value) {
        return Number(value || 0).toLocaleString("en-US",{maximumFractionDigits:2});
      }
      function fmtDate(value) {
        const p=String(value||"").split("-");
        return p.length===3 ? p[2]+"/"+p[1]+"/"+p[0] : String(value||"-");
      }
      function lookupKey(value) {
        return String(value||"").trim().toLowerCase().replace(/[أإآ]/g,"ا").replace(/ة/g,"ه").replace(/\s+/g," ");
      }
      function renderSuggestions() {
        const drivers=new Map();
        const vehicles=new Map();
        currentSuggestions.forEach(pair=>{
          if(pair.driver_name && !drivers.has(pair.driver_name)) drivers.set(pair.driver_name,pair.vehicle_number||"");
          if(pair.vehicle_number && !vehicles.has(pair.vehicle_number)) vehicles.set(pair.vehicle_number,pair.driver_name||"");
        });
        document.getElementById("fuelDriverList").innerHTML=[...drivers].map(([driver,vehicle])=>'<option value="'+esc(driver)+'">'+esc(vehicle ? "المركبة "+vehicle : "")+'</option>').join("");
        document.getElementById("fuelVehicleList").innerHTML=[...vehicles].map(([vehicle,driver])=>'<option value="'+esc(vehicle)+'">'+esc(driver||"")+'</option>').join("");
      }
      function applyDriverPair() {
        const key=lookupKey(fields.driver.value);
        const pair=currentSuggestions.find(item=>lookupKey(item.driver_name)===key);
        if(pair && (!fields.vehicle.value.trim() || fields.vehicle.dataset.suggested==="1")) {
          fields.vehicle.value=pair.vehicle_number||"";
          fields.vehicle.dataset.suggested="1";
        }
      }
      function applyVehiclePair() {
        const key=lookupKey(fields.vehicle.value);
        const pair=currentSuggestions.find(item=>lookupKey(item.vehicle_number)===key);
        if(pair && (!fields.driver.value.trim() || fields.driver.dataset.suggested==="1")) {
          fields.driver.value=pair.driver_name||"";
          fields.driver.dataset.suggested="1";
        }
      }
      function renderHistoryRows(rows) {
        if(!rows.length) {
          historyBody.innerHTML='<tr><td colspan="8" class="fuel-history-empty">لا توجد سجلات للفترة المحددة</td></tr>';
          return;
        }
        const groups=new Map();
        rows.forEach(entry=>{
          if(!groups.has(entry.entry_date)) groups.set(entry.entry_date,[]);
          groups.get(entry.entry_date).push(entry);
        });
        const html=[];
        groups.forEach((entries,date)=>{
          entries.forEach(e=>html.push('<tr><td><div class="fuel-row-actions"><button type="button" class="fuel-edit-btn" data-edit-id="'+e.id+'">تعديل</button><button type="button" class="fuel-delete-btn" data-delete-id="'+e.id+'">حذف</button></div></td><td>'+esc(fmtDate(e.entry_date))+'</td><td>'+esc(e.source_name)+'</td><td>'+esc(e.driver_name)+'</td><td>'+esc(e.vehicle_number)+'</td><td>'+fmt(e.quantity_liters)+'</td><td>'+esc(e.receipt_number||"-")+'</td><td>'+esc(e.notes||"-")+'</td></tr>'));
          const total=entries.reduce((sum,e)=>sum+Number(e.quantity_liters||0),0);
          html.push('<tr class="fuel-day-total"><td></td><td colspan="4">مجموع يوم '+esc(fmtDate(date))+'</td><td>'+fmt(total)+' لتر</td><td colspan="2"></td></tr>');
        });
        historyBody.innerHTML=html.join("");
        historyBody.querySelectorAll("[data-edit-id]").forEach(button=>button.addEventListener("click",()=>startEdit(Number(button.dataset.editId))));
        historyBody.querySelectorAll("[data-delete-id]").forEach(button=>button.addEventListener("click",()=>deleteEntry(Number(button.dataset.deleteId))));
      }
      async function loadHistory() {
        const q = new URLSearchParams();
        if (historyCompany.value.trim()) q.set("source", historyCompany.value.trim());
        if (historyMonth.value) q.set("month", historyMonth.value);
        historyBody.innerHTML='<tr><td colspan="8" class="fuel-history-empty">جاري التحميل...</td></tr>';
        try {
          const data = await api("/api/external-diesel-entry/data?"+q.toString());
          currentEntries=data.entries||[];
          currentSummary=data.summary||{};
          currentSuggestions=data.suggestions||currentSuggestions;
          const s=currentSummary;
          document.getElementById("fuelHistoryTotal").textContent=fmt(s.total_liters)+" لتر";
          document.getElementById("fuelHistoryDays").textContent=fmt(s.days_count);
          document.getElementById("fuelHistoryAverage").textContent=fmt(s.daily_average)+" لتر";
          document.getElementById("fuelCompanyList").innerHTML=(data.sources||[]).map(x=>'<option value="'+esc(x.source_name)+'"></option>').join("");
          renderSuggestions();
          renderHistoryRows(currentEntries);
        } catch (error) {
          historyBody.innerHTML='<tr><td colspan="8" class="fuel-history-empty">'+esc(error.message)+'</td></tr>';
        }
      }
      function startEdit(id) {
        const entry=currentEntries.find(item=>Number(item.id)===Number(id));
        if(!entry) return;
        editingId=entry.id;
        fields.company.value=entry.source_name;
        fields.date.value=entry.entry_date;
        fields.driver.value=entry.driver_name;
        fields.vehicle.value=entry.vehicle_number;
        fields.quantity.value=entry.quantity_liters;
        fields.receipt.value=entry.receipt_number||"";
        fields.notes.value=entry.notes||"";
        saveBtn.textContent="حفظ التعديل";
        document.getElementById("fuelResetBtn").textContent="إلغاء التعديل";
        form.scrollIntoView({behavior:"smooth",block:"start"});
        setMessage("تعديل السجل المحدد");
      }
      async function deleteEntry(id) {
        const entry=currentEntries.find(item=>Number(item.id)===Number(id));
        if(!entry) return;
        if(!confirm("حذف هذا السجل؟")) return;
        try {
          await api("/api/external-diesel-entry/"+id,{method:"DELETE"});
          if(editingId===id) resetForm(true);
          await loadHistory();
          setMessage("تم حذف السجل","success");
        } catch(error) {
          setMessage(error.message,"error");
        }
      }

      function printReport() {
        if(!currentEntries.length) {
          alert("لا توجد بيانات لطباعتها في الفترة المحددة");
          return;
        }
        const company=historyCompany.value.trim();
        const month=historyMonth.value;
        const popup=window.open("","_blank");
        if(!popup) {
          alert("المتصفح منع نافذة الطباعة");
          return;
        }
        const groups=new Map();
        currentEntries.forEach(entry=>{
          if(!groups.has(entry.entry_date)) groups.set(entry.entry_date,[]);
          groups.get(entry.entry_date).push(entry);
        });
        const body=[];
        groups.forEach((entries,date)=>{
          entries.forEach(e=>body.push('<tr><td>'+esc(fmtDate(e.entry_date))+'</td><td>'+esc(e.source_name)+'</td><td>'+esc(e.driver_name)+'</td><td>'+esc(e.vehicle_number)+'</td><td>'+fmt(e.quantity_liters)+'</td><td>'+esc(e.receipt_number||"")+'</td><td>'+esc(e.notes||"")+'</td></tr>'));
          const total=entries.reduce((sum,e)=>sum+Number(e.quantity_liters||0),0);
          body.push('<tr class="day-total"><td colspan="4">مجموع يوم '+esc(fmtDate(date))+'</td><td>'+fmt(total)+'</td><td colspan="2"></td></tr>');
        });
        const period=month ? ("شهر "+Number(month.split("-")[1])+"/"+month.split("-")[0]) : "جميع الفترات";
        const title=company ? ("كشف السولار الخارجي - "+company) : "كشف السولار الخارجي";
        popup.document.write('<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>'+esc(title)+'</title><style>@page{size:A4 portrait;margin:34mm 4mm 25mm}*{box-sizing:border-box}html,body{margin:0;padding:0;font-family:Arial,Tahoma,sans-serif;color:#111;direction:rtl}.print-header{position:fixed;top:-34mm;right:-4mm;width:210mm;height:30mm;overflow:hidden}.print-header img{display:block;width:210mm;height:30mm;object-fit:fill}.print-footer{position:fixed;bottom:-25mm;right:-4mm;width:210mm;height:22mm;overflow:hidden}.print-footer img{display:block;width:210mm;height:22mm;object-fit:fill}.title{text-align:center;margin:0 0 2mm}.title h1{font-size:17px;margin:0}.title p{font-size:12px;margin:1mm 0}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:1mm;margin:2mm 0}.summary div{border:1px solid #777;padding:1.5mm;text-align:center}.summary span{display:block;font-size:9px}.summary strong{display:block;font-size:12px;margin-top:.5mm}table{width:100%;border-collapse:collapse;table-layout:fixed}thead{display:table-header-group}tfoot{display:table-footer-group}tr{break-inside:avoid;page-break-inside:avoid}th,td{border:1px solid #555;padding:1.2mm .7mm;text-align:center;font-size:9.5px;overflow-wrap:anywhere}th{background:#e9efec}.day-total td{background:#eef6f2;font-weight:800}.grand-total td{background:#173f31;color:#fff;font-weight:800}</style></head><body><div class="print-header"><img src="/assets/header.png"></div><div class="print-footer"><img src="/assets/footer.png"></div><div class="title"><h1>'+esc(title)+'</h1><p>'+esc(period)+'</p></div><section class="summary"><div><span>إجمالي السولار</span><strong>'+fmt(currentSummary.total_liters)+' لتر</strong></div><div><span>أيام التعبئة</span><strong>'+fmt(currentSummary.days_count)+'</strong></div><div><span>المتوسط اليومي</span><strong>'+fmt(currentSummary.daily_average)+' لتر</strong></div></section><table><thead><tr><th>التاريخ</th><th>الشركة</th><th>السائق</th><th>المركبة</th><th>الكمية</th><th>الوصل</th><th>ملاحظات</th></tr></thead><tbody>'+body.join("")+'</tbody><tfoot><tr class="grand-total"><td colspan="4">المجموع الكلي</td><td>'+fmt(currentSummary.total_liters)+'</td><td colspan="2"></td></tr></tfoot></table><script>window.onload=()=>Promise.all(Array.from(document.images).map(img=>img.complete?Promise.resolve():new Promise(resolve=>{img.onload=resolve;img.onerror=resolve}))).then(()=>setTimeout(()=>window.print(),250));<\/script></body></html>');
        popup.document.close();
      }
      function resetForm(keepCompany=true) {
        const company = keepCompany ? fields.company.value : "";
        editingId=null;
        form.reset();
        fields.company.value = company;
        fields.date.value = today();
        saveBtn.textContent="حفظ التعبئة";
        document.getElementById("fuelResetBtn").textContent="تفريغ الحقول";
        fields.driver.focus();
        setMessage("");
      }
      async function api(url, options={}) {
        const response = await fetch(url, {
          cache:"no-store",
          headers:{ "Content-Type":"application/json", "X-Entry-Token":token, ...(options.headers || {}) },
          ...options
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok || data.ok === false) throw new Error(data.message || "تعذر تنفيذ العملية");
        return data;
      }
      async function verify() {
        if (!/^[a-f0-9]{64}$/i.test(token)) {
          statusNode.textContent = "رابط تعبئة السولار غير صالح.";
          statusNode.classList.add("error");
          return;
        }
        try {
          const data = await api("/api/external-diesel-entry/status");
          statusNode.textContent = "الرابط فعال — " + (data.label || "موظف تعبئة السولار");
          form.hidden = false;
          history.hidden = false;
          fields.date.value = today();
          historyMonth.value = today().slice(0,7);
          await loadHistory();
          fields.company.focus();
        } catch (error) {
          statusNode.textContent = error.message;
          statusNode.classList.add("error");
        }
      }
      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const payload = {
          source_name: fields.company.value.trim(),
          entry_date: fields.date.value,
          driver_name: fields.driver.value.trim(),
          vehicle_number: fields.vehicle.value.trim(),
          quantity_liters: Number(fields.quantity.value),
          receipt_number: fields.receipt.value.trim(),
          notes: fields.notes.value.trim()
        };
        if (!payload.source_name || !payload.entry_date || !payload.driver_name || !payload.vehicle_number || !(payload.quantity_liters > 0)) {
          setMessage("أكمل الشركة والتاريخ والسائق والمركبة والكمية.", "error");
          return;
        }
        saveBtn.disabled = true;
        setMessage("جاري حفظ التعبئة...");
        try {
          const data = await api(editingId ? "/api/external-diesel-entry/"+editingId : "/api/external-diesel-entry", { method:editingId ? "PUT" : "POST", body:JSON.stringify(payload) });
          setMessage(data.message || "تم حفظ التعبئة بنجاح.", "success");
          const company = fields.company.value;
          const date = fields.date.value;
          editingId=null;
          form.reset();
          fields.company.value = company;
          fields.date.value = date;
          saveBtn.textContent="حفظ التعبئة";
          document.getElementById("fuelResetBtn").textContent="تفريغ الحقول";
          fields.driver.focus();
          await loadHistory();
        } catch (error) {
          setMessage(error.message, "error");
        } finally {
          saveBtn.disabled = false;
        }
      });
      document.getElementById("fuelResetBtn").addEventListener("click", () => resetForm(true));
      fields.driver.addEventListener("input",()=>{fields.driver.dataset.suggested="";applyDriverPair();});
      fields.vehicle.addEventListener("input",()=>{fields.vehicle.dataset.suggested="";applyVehiclePair();});
      document.getElementById("fuelHistoryLoadBtn").addEventListener("click", loadHistory);
      document.getElementById("fuelPrintBtn").addEventListener("click", printReport);
      historyCompany.addEventListener("change", loadHistory);
      historyMonth.addEventListener("change", loadHistory);
      verify();
    })();
  </script>
</body>
</html>

<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تسجيل الدخول - مكب المنيا</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="v3.css"><link rel="stylesheet" href="/review-improvements.css?v=20260919-4"></head><body class="auth-page"><main class="auth-shell"><section class="auth-card"><div class="auth-brand"><img src="/assets/brand-recycle-truck-jsc-512.png" alt="JSC_H&B" style="display:block;width:112px;height:112px;object-fit:contain;margin:0 auto 12px;border-radius:22px;"><strong>نظام إدارة مكب المنيا</strong><span>تسجيل الدخول</span></div><label>اسم المستخدم أو البريد الإلكتروني<input id="loginUser" autocomplete="username" placeholder="username أو name@example.com"></label><label>كلمة المرور<input id="loginPass" type="password" autocomplete="current-password"></label><button id="togglePassword" type="button" class="secondary" aria-controls="loginPass" aria-pressed="false">إظهار كلمة المرور</button><button id="loginBtn" type="button">دخول</button><button id="forgotBtn" type="button" class="secondary" style="margin-top:8px">نسيت كلمة السر؟</button><p id="loginMessage" role="status" aria-live="polite"></p><div id="resetBox" style="display:none;margin-top:16px;padding-top:16px;border-top:1px solid #d9e1e8"><strong style="display:block;margin-bottom:10px">استعادة كلمة المرور</strong><label>اسم المستخدم أو البريد الإلكتروني<input id="resetIdentifier" autocomplete="username"></label><button id="sendCodeBtn" type="button" class="secondary">إرسال رمز التحقق إلى البريد</button><div id="resetStep2" style="display:none;margin-top:12px"><label>رمز التحقق<input id="resetCode" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="6 أرقام"></label><label>كلمة المرور الجديدة<input id="newPassword" type="password" autocomplete="new-password" minlength="8"></label><button id="resetPassBtn" type="button">تغيير كلمة المرور</button></div><p id="resetMessage"></p></div><div class="auth-credit">تصميم قسم المكب — المهندس محمد جبرين</div></section></main><script>async function status(){const r=await fetch('/api/auth/status');const d=await r.json();if(d.setupRequired)location.replace('/setup.html');if(d.authenticated)location.replace('/');}async function login(){const m=document.getElementById('loginMessage');m.textContent='جاري تسجيل الدخول...';const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:loginUser.value,password:loginPass.value})});const d=await r.json();if(!r.ok){m.textContent=d.message||'فشل تسجيل الدخول';return;}location.replace('/');}function toggleReset(){resetBox.style.display=resetBox.style.display==='none'?'block':'none';if(resetBox.style.display==='block'&&!resetIdentifier.value)resetIdentifier.value=loginUser.value.trim();resetMessage.textContent='';}async function sendCode(){const identifier=resetIdentifier.value.trim();resetMessage.textContent='جاري إرسال الرمز...';sendCodeBtn.disabled=true;try{const r=await fetch('/api/auth/forgot-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({identifier})});const d=await r.json();resetMessage.textContent=d.message||'تعذر إرسال الرمز';if(r.ok)resetStep2.style.display='block';}catch{resetMessage.textContent='تعذر الاتصال بالخادم';}finally{sendCodeBtn.disabled=false;}}async function resetPassword(){const identifier=resetIdentifier.value.trim();const code=resetCode.value.trim();const new_password=newPassword.value;resetMessage.textContent='جاري تغيير كلمة المرور...';resetPassBtn.disabled=true;try{const r=await fetch('/api/auth/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({identifier,code,new_password})});const d=await r.json();resetMessage.textContent=d.message||'تعذر تغيير كلمة المرور';if(r.ok){loginUser.value=identifier;loginPass.value='';setTimeout(()=>{resetBox.style.display='none';loginMessage.textContent='تم تغيير كلمة المرور. سجل الدخول بكلمة المرور الجديدة.';},700);}}catch{resetMessage.textContent='تعذر الاتصال بالخادم';}finally{resetPassBtn.disabled=false;}}togglePassword.onclick=()=>{const show=loginPass.type==='password';loginPass.type=show?'text':'password';togglePassword.textContent=show?'إخفاء كلمة المرور':'إظهار كلمة المرور';togglePassword.setAttribute('aria-pressed',String(show));};loginBtn.onclick=login;forgotBtn.onclick=toggleReset;sendCodeBtn.onclick=sendCode;resetPassBtn.onclick=resetPassword;loginPass.addEventListener('keydown',e=>{if(e.key==='Enter')login();});resetCode.addEventListener('keydown',e=>{if(e.key==='Enter')resetPassword();});newPassword.addEventListener('keydown',e=>{if(e.key==='Enter')resetPassword();});status();</script><script src="/review-improvements.js?v=20260919-4" defer></script></body></html>

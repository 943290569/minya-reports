<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تسجيل الدخول - مكب المنيا</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="v3.css"></head><body class="auth-page"><main class="auth-shell"><section class="auth-card"><div class="auth-brand"><strong>نظام إدارة مكب المنيا</strong><span>تسجيل الدخول</span></div><label>اسم المستخدم أو البريد الإلكتروني<input id="loginUser" autocomplete="username" placeholder="username أو name@example.com"></label><label>كلمة المرور<input id="loginPass" type="password" autocomplete="current-password"></label><button id="loginBtn" type="button">دخول</button><p id="loginMessage"></p><div class="auth-credit">تصميم قسم المكب — المهندس محمد جبرين</div></section></main><script>async function status(){const r=await fetch('/api/auth/status');const d=await r.json();if(d.setupRequired)location.replace('/setup.html');if(d.authenticated)location.replace('/');}async function login(){const m=document.getElementById('loginMessage');m.textContent='جاري تسجيل الدخول...';const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:loginUser.value,password:loginPass.value})});const d=await r.json();if(!r.ok){m.textContent=d.message||'فشل تسجيل الدخول';return;}location.replace('/');}loginBtn.onclick=login;loginPass.addEventListener('keydown',e=>{if(e.key==='Enter')login();});status();</script></body></html>

<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>حساب مسؤول الشكاوى</title><link rel="stylesheet" href="/employee-complaints.css?v=2"></head>
<body><main class="complaint-shell"><section class="complaint-card"><h1>حساب مسؤول الشكاوى</h1><p class="lead">هذه الصفحة للمدير فقط. أنشئ أو غيّر حساب الموظف الذي سيدخل إلى إدارة الشكاوى وحدها.</p>
<form id="f"><label>اسم الموظف<input id="d" maxlength="120"></label><label>اسم المستخدم<input id="u" maxlength="40" autocomplete="off" required></label><label>كلمة المرور<input id="p" type="password" minlength="8" autocomplete="new-password" required></label><button id="b">حفظ الحساب</button><div id="m" class="message"></div></form><p id="cur"></p></section></main>
<script>
async function load(){const r=await fetch("/api/employee-complaints-reviewer");if(r.status===401){location.href="/login.html";return}const x=await r.json();if(r.status===403){m.textContent="هذه الصفحة للمدير فقط.";f.hidden=true;return}if(x.reviewer){u.value=x.reviewer.username;d.value=x.reviewer.display_name||"";cur.textContent="الحساب الحالي: "+x.reviewer.username}}
f.onsubmit=async e=>{e.preventDefault();b.disabled=true;m.textContent="";const r=await fetch("/api/employee-complaints-reviewer",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:u.value.trim(),display_name:d.value.trim(),password:p.value})});const x=await r.json().catch(()=>({}));b.disabled=false;m.textContent=r.ok?"تم حفظ حساب مسؤول الشكاوى.":(x.message||"تعذر الحفظ");if(r.ok){p.value="";load()}};load();
</script></body></html>

<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة شكاوى الموظفين</title><link rel="stylesheet" href="/employee-complaints.css?v=1"><style>
.admin{width:min(1180px,100%);margin:auto;padding:18px 12px}.toolbar{display:flex;gap:10px;flex-wrap:wrap}.toolbar select{width:auto;min-width:180px}.toolbar input{width:auto;flex:1;min-width:160px}.toolbar label{margin:0;font-size:13px}.toolbar label input{width:100%}.toolbar button{margin-top:7px}.items{display:grid;gap:12px}.item{background:#fff;border:1px solid #dfe7e2;border-radius:12px;padding:16px}.head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.meta{display:flex;gap:14px;flex-wrap:wrap;color:#617269;font-size:13px;margin:8px 0}.text{white-space:pre-wrap;line-height:1.7}.edit{display:grid;grid-template-columns:180px 1fr 1fr;gap:10px;align-items:end}.edit button{margin:0}.late{border-inline-start:5px solid #9b2c2c}@media(max-width:760px){.edit{grid-template-columns:1fr}.toolbar select,.toolbar input,.toolbar label{width:100%;min-width:0}}
</style></head><body><main class="admin"><section class="complaint-card"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap"><h1>إدارة شكاوى الموظفين</h1><button id="logout" type="button" class="secondary" style="margin:0">تسجيل الخروج</button></div><div class="toolbar"><select id="st" aria-label="الحالة"><option value="">كل الحالات</option><option value="new">جديدة</option><option value="reviewing">قيد المراجعة</option><option value="action_taken">تم اتخاذ إجراء</option><option value="responded">تم الرد</option><option value="closed">مغلقة</option></select><select id="ty" aria-label="طبيعة الشكوى"><option value="">كل الأنواع</option><option>إدارية</option><option>مالية</option><option>الدوام</option><option>المواصلات</option><option>بيئة العمل</option><option>السلامة</option><option>المعدات والأدوات</option><option>معاملة وظيفية</option><option>أخرى</option></select><select id="complaintSort" aria-label="ترتيب الشكاوى"><option value="submitted_desc">التقديم — الأحدث أولًا</option><option value="submitted_asc">التقديم — الأقدم أولًا</option><option value="due_asc">الاستحقاق — الأقرب أولًا</option><option value="updated_desc">آخر تحديث — الأحدث أولًا</option></select><input id="complaintSearch" type="search" aria-label="بحث الشكاوى" placeholder="بحث بالرقم أو الاسم أو التفاصيل"><label>من تاريخ التقديم<input id="complaintFrom" type="date"></label><label>إلى تاريخ التقديم<input id="complaintTo" type="date"></label><button id="resetFilters" type="button" class="secondary">مسح الفلاتر</button><button id="reload" type="button">تحديث</button></div><p id="sum"></p></section><div id="items" class="items"></div></main><script>
const names={new:"جديدة",reviewing:"قيد المراجعة",action_taken:"تم اتخاذ إجراء",responded:"تم الرد",closed:"مغلقة"},E=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])),D=v=>v?String(v).slice(0,10).split("-").reverse().join("/"):"-";
async function load(){const q=new URLSearchParams(),s=st.value,t=ty.value;if(s)q.set("status",s);if(t)q.set("type",t);const r=await fetch("/api/employee-complaints?"+q);if(r.status===401){location.href="/employee-complaints-login.html";return}const d=await r.json();if(!r.ok){sum.textContent=d.message||"تعذر التحميل";return}sum.textContent="عدد الشكاوى المعروضة: "+d.complaints.length;const today=new Date().toISOString().slice(0,10);items.innerHTML=d.complaints.map(c=>`<section class="item ${c.due_date<today&&!["responded","closed"].includes(c.status)?"late":""}" data-id="${c.id}" data-submitted="${E(c.submitted_at)}" data-due="${E(c.due_date)}" data-updated="${E(c.updated_at||c.submitted_at)}" data-search="${E([c.complaint_no,c.employee_name,c.complaint_text,c.complaint_type].join(' '))}"><div class="head"><strong>${E(c.complaint_no)}</strong><span>${E(names[c.status]||c.status)}</span></div><div class="meta"><span>الاسم: ${E(c.employee_name||"بدون اسم")}</span><span>${E(c.complaint_type)}</span><span>التقديم: ${D(c.submitted_at)}</span><span>الاستحقاق: ${D(c.due_date)}</span></div><div class="text">${E(c.complaint_text||"شكوى صوتية بدون نص")}</div>${c.audio_original_name?`<p><a href="/api/employee-complaints/${c.id}/audio" target="_blank">تشغيل التسجيل الصوتي</a></p>`:""}<div class="edit"><label>الحالة<select class="status"><option value="new" ${c.status==="new"?"selected":""}>جديدة</option><option value="reviewing" ${c.status==="reviewing"?"selected":""}>قيد المراجعة</option><option value="action_taken" ${c.status==="action_taken"?"selected":""}>تم اتخاذ إجراء</option><option value="responded" ${c.status==="responded"?"selected":""}>تم الرد</option><option value="closed" ${c.status==="closed"?"selected":""}>مغلقة</option></select></label><label>الإجراء المتخذ<textarea class="action" rows="3">${E(c.action_taken)}</textarea></label><label>الرد<textarea class="response" rows="3">${E(c.response_text)}</textarea></label><button class="save" type="button">حفظ التحديث</button></div></section>`).join("")||"<section class='complaint-card'>لا توجد شكاوى.</section>";document.querySelectorAll(".save").forEach(b=>b.onclick=save);applyView()}
async function save(e){const x=e.target.closest(".item");e.target.disabled=true;const body={status:x.querySelector(".status").value,action_taken:x.querySelector(".action").value,response_text:x.querySelector(".response").value};const r=await fetch("/api/employee-complaints/"+x.dataset.id,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});e.target.disabled=false;if(!r.ok){const d=await r.json().catch(()=>({}));alert(d.message||"تعذر الحفظ");return}load()}

function compareComplaintCards(a,b,order){
  const options={submitted_desc:["submitted",-1],submitted_asc:["submitted",1],due_asc:["due",1],updated_desc:["updated",-1]};
  const [field,direction]=options[order]||options.submitted_desc;
  const left=a.dataset[field]||"",right=b.dataset[field]||"";
  if(!left&&right)return 1;if(left&&!right)return -1;
  return left.localeCompare(right)*direction||Number(b.dataset.id)-Number(a.dataset.id);
}
function applyView(){
  const cards=Array.from(items.querySelectorAll(".item"));
  const query=document.getElementById("complaintSearch").value.trim().toLocaleLowerCase("ar");
  const from=document.getElementById("complaintFrom").value,to=document.getElementById("complaintTo").value;
  if(from&&to&&from>to){sum.textContent="تاريخ البداية يجب أن يسبق تاريخ النهاية.";return}
  cards.sort((a,b)=>compareComplaintCards(a,b,document.getElementById("complaintSort").value));
  let shown=0;
  for(const card of cards){
    const date=(card.dataset.submitted||"").slice(0,10);
    card.hidden=Boolean((query&&!card.dataset.search.toLocaleLowerCase("ar").includes(query))||(from&&date<from)||(to&&date>to));
    if(!card.hidden)shown++;items.appendChild(card);
  }
  sum.textContent="الشكاوى المعروضة: "+shown+" من "+cards.length;
}
document.getElementById("complaintSort").onchange=applyView;
document.getElementById("complaintSearch").oninput=applyView;
document.getElementById("complaintFrom").onchange=applyView;
document.getElementById("complaintTo").onchange=applyView;
document.getElementById("resetFilters").onclick=()=>{
  st.value="";ty.value="";
  for(const id of ["complaintSearch","complaintFrom","complaintTo"])document.getElementById(id).value="";
  document.getElementById("complaintSort").value="submitted_desc";load();
};

logout.onclick=async()=>{await fetch("/api/employee-complaints-auth/logout",{method:"POST"}).catch(()=>{});location.href="/employee-complaints-login.html"};reload.onclick=load;st.onchange=load;ty.onchange=load;load();</script></body></html>

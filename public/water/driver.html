<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17654d"><title>تسجيل تنكات رش المياه</title><link rel="manifest" href="/water/manifest.json"><link rel="stylesheet" href="/water/style.css"></head><body><main><h1>تنكات رش المياه</h1><h2 id="driverName">جاري فتح رابط السائق</h2><p id="offlineReady"></p><section id="editor" hidden><form id="form"><label>التاريخ<input id="date" type="date" required></label><label>عدد التنكات لهذا اليوم<input id="tanks" type="number" inputmode="numeric" min="0" max="1000" step="1" required></label><p id="quantity">كمية المياه 0 م³</p><small>سعة التنك 4 م³. أدخل مجموع تنكات اليوم، وليس عددًا إضافيًا.</small><label>ملاحظات اختيارية<textarea id="notes" maxlength="1000" rows="2"></textarea></label><button id="save" type="submit">حفظ</button></form><p id="status" role="status"></p><button id="sync" type="button">إرسال الآن</button><button id="resolve" type="button" hidden>مراجعة التسجيل الموجود</button></section><section><h2>تسجيلاتي</h2><div id="history"></div></section></main><script src="/water/driver.js"></script></body></html>

<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إعداد النظام - مكب المنيا</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="v3.css"></head><body class="auth-page"><main class="auth-shell"><section class="auth-card"><div class="auth-brand"><strong>إعداد نظام مكب المنيا</strong><span>إنشاء حساب المدير الأول</span></div><label>اسم المستخدم<input id="setupUser" value="admin" autocomplete="username"></label><label>الاسم الظاهر<input id="setupName" value="المهندس محمد جبرين"></label><label>كلمة المرور<input id="setupPass" type="password" autocomplete="new-password" placeholder="8 أحرف على الأقل"></label><label>تأكيد كلمة المرور<input id="setupPass2" type="password" autocomplete="new-password"></label><button id="setupBtn" type="button">إنشاء حساب المدير</button><p id="setupMessage"></p><div class="auth-credit">تصميم قسم المكب — المهندس محمد جبرين</div></section></main><script>async function status(){const r=await fetch('/api/auth/status');const d=await r.json();if(!d.setupRequired)location.replace(d.authenticated?'/':'/login.html');}async function setup(){const m=document.getElementById('setupMessage');if(setupPass.value!==setupPass2.value){m.textContent='كلمتا المرور غير متطابقتين';return;}m.textContent='جاري إعداد النظام...';const r=await fetch('/api/auth/setup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:setupUser.value,display_name:setupName.value,password:setupPass.value})});const d=await r.json();if(!r.ok){m.textContent=d.message||'فشل إعداد النظام';return;}location.replace('/login.html');}setupBtn.onclick=setup;status();</script></body></html>

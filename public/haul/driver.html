<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17654d"><title>تسجيل نقلات الطمم</title><link rel="manifest" href="/haul/manifest.json"><link rel="stylesheet" href="/haul/style.css"></head><body><main><h1>نقلات الطمم</h1><h2 id="driverName">جاري فتح رابط السائق</h2><p id="offlineReady"></p><section id="editor" hidden><form id="form"><label>التاريخ<input id="date" type="date" required></label><p id="weekday"></p><label>موقع الطمم<select id="site" required><option>سلوب</option><option>أم رمبة</option></select></label><label>عداد البداية بالكيلومتر<input id="odo_start" type="number" min="0" max="10000000" step="0.1" inputmode="decimal" required></label><label>عداد النهاية بالكيلومتر<input id="odo_end" type="number" min="0" max="10000000" step="0.1" inputmode="decimal" required></label><label>عدد النقلات لهذا اليوم<input id="trips" type="number" inputmode="numeric" min="0" max="1000" step="1" required></label><p id="quantity"></p><small>سعة النقلة 4 م³. أدخل مجموع نقلةات اليوم، وليس عددًا إضافيًا.</small><label>ملاحظات اختيارية<textarea id="notes" maxlength="1000" rows="2"></textarea></label><button id="save" type="submit">حفظ</button></form><p id="status" role="status"></p><button id="sync" type="button">إرسال الآن</button><button id="resolve" type="button" hidden>مراجعة التسجيل الموجود</button></section><section><h2>تسجيلاتي</h2><div id="history"></div></section></main><script src="/haul/driver.js"></script></body></html>

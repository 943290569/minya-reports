<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الصيانة والحوادث</title><link rel="stylesheet" href="style.css?v=maintenance-incidents-v1"><link rel="stylesheet" href="app-bundle.css?v=3.5.0-20260908-stable10-summary3"><link rel="stylesheet" href="mobile-vertical-menu.css?v=maintenance-incidents-v1"><style>.mi-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.mi-grid label{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:13px}.mi-grid .wide{grid-column:span 3}.mi-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.mi-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:14px 0}.mi-kpi{padding:14px;border:1px solid #dbe4df;border-radius:12px;background:#fff}.mi-kpi b{display:block;font-size:24px}.mi-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.mi-tabs button.active{background:#166534;color:#fff}.mi-status{font-weight:700}.mi-open{color:#b91c1c}.mi-progress{color:#b45309}.mi-closed{color:#166534}@media(max-width:760px){.mi-grid{grid-template-columns:1fr}.mi-grid .wide{grid-column:auto}.mi-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}</style></head><body><header class="top-header"><div><h1>نظام إدارة مكب المنيا</h1><p>الصيانة والحوادث والمتابعة</p></div><nav><a class="app-nav-link" href="/">الرئيسية</a><a class="app-nav-link active" href="/maintenance-incidents.html">الصيانة والحوادث</a></nav></header><main class="container"><section class="panel"><div class="mi-tabs"><button id="tabMaintenance" class="active">الصيانة</button><button id="tabIncidents">الحوادث والأعطال</button></div><div id="maintenanceForm"><h2>إضافة سجل صيانة</h2><div class="mi-grid"><label>المركبة / المعدة<input id="mEquipment"></label><label>التاريخ<input id="mDate" type="date"></label><label>نوع الحالة<select id="mStatus"><option>صيانة دورية</option><option>صيانة طارئة</option><option>عطل</option><option>ملاحظة</option></select></label><label class="wide">الوصف<textarea id="mDescription" rows="3"></textarea></label><label class="wide">الإجراء المتخذ<textarea id="mAction" rows="2"></textarea></label><label>التكلفة<input id="mCost" type="number" min="0" step="0.01"></label></div><div class="mi-actions"><button id="saveMaintenance" class="v3-primary">حفظ سجل الصيانة</button></div><p id="mMsg"></p></div><div id="incidentForm" hidden><h2>إضافة حادث / عطل للمتابعة</h2><div class="mi-grid"><label>المركبة / المعدة<input id="iAsset"></label><label>التاريخ<input id="iDate" type="date"></label><label>الحالة<select id="iState"><option>مفتوحة</option><option>تحت المعالجة</option><option>مغلقة</option></select></label><label>النوع<select id="iType"><option>حادث</option><option>عطل</option><option>ضرر</option><option>سلامة</option></select></label><label>المسؤول عن المتابعة<input id="iOwner"></label><label>التكلفة<input id="iCost" type="number" min="0" step="0.01"></label><label class="wide">الوصف<textarea id="iDescription" rows="3"></textarea></label><label class="wide">الإجراء المتخذ<textarea id="iAction" rows="2"></textarea></label></div><div class="mi-actions"><button id="saveIncident" class="v3-primary">حفظ الحادث</button></div><p id="iMsg"></p></div></section><section class="panel"><div class="mi-kpis" id="miKpis"></div><div class="mi-actions"><input id="miSearch" placeholder="بحث بالمركبة أو المعدة أو الوصف"><input id="miFrom" type="date"><input id="miTo" type="date"><button id="miRefresh">تحديث</button><button id="miPrint">طباعة</button></div><div class="v3-table-wrap"><table class="v3-table"><thead id="miHead"></thead><tbody id="miBody"></tbody></table></div></section></main><script src="js/app-auth.js?v=maintenance-incidents-v1"></script><script src="js/app-header-menu.js?v=maintenance-incidents-v1"></script><script src="js/app-maintenance-incidents.js?v=maintenance-incidents-v1"></script></body></html>
